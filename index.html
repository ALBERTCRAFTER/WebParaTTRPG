<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanzador de dados</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Lanzador de dados</h1>

    <div id="controles">
        <label>
            Nº de dados
            <input type="number" id="cantidad" value="1" min="1" max="100">
        </label>

        <span>d</span>

        <label>
            Caras
            <input type="number" id="caras" value="20" min="2" max="1000">
        </label>

        <span>+</span>

        <label>
            Modificador
            <input type="number" id="modificador" value="0" min="-1000" max="1000">
        </label>

        <button id="tirar">Tirar</button>
    </div>

    <p id="resultado">Elige los dados y pulsa Tirar</p>
    <p id="detalle"></p>

    <script src="script.js"></script>
</body>

</html>
