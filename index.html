<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanzador de dados</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Lanzador de dados</h1>

  <div id="botones">
    <button data-caras="4">d4</button>
    <button data-caras="6">d6</button>
    <button data-caras="8">d8</button>
    <button data-caras="10">d10</button>
    <button data-caras="12">d12</button>
    <button data-caras="20">d20</button>
    <button data-caras="100">d100</button>
  </div>

  <p id="resultado">Pulsa un dado para lanzarlo</p>

  <script src="script.js"></script>
</body>
</html>
